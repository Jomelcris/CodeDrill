spring.application.name=codedrill
server.port=8080

# MySQL (XAMPP defaults: user "root", empty password). The database is created automatically.
spring.datasource.url=jdbc:mysql://localhost:3306/codedrill_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

# Tables are created/updated automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
